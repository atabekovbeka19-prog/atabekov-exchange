<!DOCTYPE html>

<html lang="ru">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<meta name="theme-color" content="#101827">

<title>ATABEKOV EXCHANGE</title>

<style>

*{box-sizing:border-box}

body{

 margin:0;

 padding:18px;

 background:#101827;

 color:#fff;

 font-family:Arial,sans-serif;

}

.container{max-width:650px;margin:auto}

h1{text-align:center;font-size:25px;letter-spacing:2px}

.subtitle{text-align:center;color:#9ca9bd;margin-bottom:25px}

.card{

 background:#1b293b;

 padding:18px;

 border-radius:16px;

 margin-bottom:16px;

}

h2{font-size:18px;margin-top:0}

label{display:block;color:#aebbd0;font-size:13px;margin:12px 0 6px}

input,select,button{

 width:100%;

 padding:13px;

 border-radius:9px;

 border:1px solid #40516a;

 background:#101b2a;

 color:white;

 font-size:16px;

}

button{

 background:#d4ad61;

 color:#172033;

 font-weight:bold;

 border:0;

 margin-top:12px;

 cursor:pointer;

}

button.secondary{background:#34445b;color:white}

button.danger{background:#a83e48;color:white}

.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.result{

 background:#101b2a;

 padding:16px;

 border-radius:12px;

 margin-top:15px;

}

.result strong{font-size:25px;color:#e5bd70}

.small{font-size:12px;color:#aebbd0}

.transaction{

 border-bottom:1px solid #40516a;

 padding:12px 0;

 font-size:14px;

}

.transaction:last-child{border:0}

.rate-row{

 display:grid;

 grid-template-columns:1fr 1fr 1fr;

 gap:8px;

 align-items:end;

 margin-bottom:10px;

}

.rate-row input{padding:10px;font-size:14px}

.rate-row label{margin-top:0}

.report-title{font-weight:bold;color:#e5bd70}

@media(max-width:420px){

 body{padding:12px}

 .row{gap:7px}

 .rate-row{gap:5px}

 .rate-row input{font-size:12px;padding:9px 5px}

}

</style>

</head>

<body>

<div class="container">

<h1>ATABEKOV EXCHANGE</h1>

<div class="subtitle">Валютный калькулятор и учёт операций</div>

<div class="card">

<h2>Курсы валют</h2>

<p class="small">Укажите курс за 1 единицу валюты в сомах.</p>

<div class="rate-row">

<div><label>Валюта</label><input value="RUB" disabled></div>

<div><label>Покупка</label><input id="RUBbuy" type="number" step="0.0001" value="1.20"></div>

<div><label>Продажа</label><input id="RUBsell" type="number" step="0.0001" value="1.05"></div>

</div>

<div class="rate-row">

<div><label>Валюта</label><input value="USD" disabled></div>

<div><label>Покупка</label><input id="USDbuy" type="number" step="0.0001" value="87.20"></div>

<div><label>Продажа</label><input id="USDsell" type="number" step="0.0001" value="87.20"></div>

</div>

<div class="rate-row">

<div><label>Валюта</label><input value="UZS" disabled></div>

<div><label>Покупка</label><input id="UZSbuy" type="number" step="0.000001" value="0.0069"></div>

<div><label>Продажа</label><input id="UZSsell" type="number" step="0.000001" value="0.0069"></div>

</div>

<button onclick="saveRates()">Сохранить курсы</button>

</div>

<div class="card">

<h2>Калькулятор обмена</h2>

<label>Клиент даёт</label>

<div class="row">

<input id="amount" type="number" placeholder="Сумма" oninput="calculate()">

<select id="from" onchange="calculate()">

<option>RUB</option>

<option>USD</option>

<option>UZS</option>

<option>KGS</option>

</select>

</div>

<label>Клиент получает</label>

<select id="to" onchange="calculate()">

<option>KGS</option>

<option>RUB</option>

<option>USD</option>

<option>UZS</option>

</select>

<div class="result">

<div class="small">Клиент получит:</div>

<strong id="answer">0.00 KGS</strong>

<p class="small" id="calculationInfo">Введите сумму для расчёта</p>

</div>

<button onclick="addTransaction()">Добавить операцию в отчёт</button>

</div>

<div class="card">

<h2>Отчёты</h2>

<label>Название нового отчёта</label>

<input id="newReportName" placeholder="Например: Смена 27 ноября">

<button onclick="createReport()">Создать отчёт</button>

<label>Выберите отчёт</label>

<select id="reportSelect" onchange="selectReport()"></select>

<div id="reportInfo" class="result"></div>

<div class="row">

<button class="secondary" onclick="renameReport()">Переименовать</button>

<button class="danger" onclick="deleteReport()">Удалить отчёт</button>

</div>

<button class="secondary" onclick="exportCSV()">Скачать отчёт CSV</button>

</div>

<div class="card">

<h2>История операций</h2>

<div id="history" class="small">Пока операций нет.</div>

</div>

</div>

<script>

const currencies = ["RUB","USD","UZS","KGS"];

let rates = {

 RUB:{buy:1.20,sell:1.05},

 USD:{buy:87.20,sell:87.20},

 UZS:{buy:0.0069,sell:0.0069}

};

let reports = [];

let activeReport = null;

function loadData(){

 try{

  const savedRates=localStorage.getItem("atabekov_rates");

  const savedReports=localStorage.getItem("atabekov_reports");

  if(savedRates) rates=JSON.parse(savedRates);

  if(savedReports) reports=JSON.parse(savedReports);

 }catch(e){console.log(e)}

 ["RUB","USD","UZS"].forEach(c=>{

  document.getElementById(c+"buy").value=rates[c].buy;

  document.getElementById(c+"sell").value=rates[c].sell;

 });

 if(reports.length===0){

  reports.push({

   id:Date.now(),

   name:"Мой первый отчёт",

   transactions:[]

  });

 }

 activeReport=reports[0].id;

 saveData();

 updateReports();

 calculate();

}

function saveData(){

 localStorage.setItem("atabekov_rates",JSON.stringify(rates));

 localStorage.setItem("atabekov_reports",JSON.stringify(reports));

}

function saveRates(){

 ["RUB","USD","UZS"].forEach(c=>{

  rates[c].buy=Number(document.getElementById(c+"buy").value);

  rates[c].sell=Number(document.getElementById(c+"sell").value);

 });

 saveData();

 calculate();

 alert("Курсы сохранены");

}

function getKGSValue(amount,currency){

 if(currency==="KGS") return amount;

 return amount*rates[currency].buy;

}

function calculate(){

 const amount=Number(document.getElementById("amount").value)||0;

 const from=document.getElementById("from").value;

 const to=document.getElementById("to").value;

 let kgs=getKGSValue(amount,from);

 let result;

 if(to==="KGS"){

  result=kgs;

 }else{

  result=kgs/rates[to].sell;

 }

 document.getElementById("answer").textContent=

  result.toLocaleString("ru-RU",{maximumFractionDigits:4})+" "+to;

 let info="";

 if(from!=="KGS"){

  info+="Покупка "+from+": "+rates[from].buy+" сом. ";

 }

 if(to!=="KGS"){

  info+="Продажа "+to+": "+rates[to].sell+" сом.";

 }

 if(from===to) info="Одинаковая валюта.";

 document.getElementById("calculationInfo").textContent=

  amount>0?info:"Введите сумму для расчёта";

 return {amount,from,to,result,kgs};

}

function createReport(){

 const name=document.getElementById("newReportName").value.trim();

 if(!name){

  alert("Введите название отчёта");

  return;

 }

 const report={

  id:Date.now(),

  name:name,

  transactions:[]

 };

 reports.push(report);

 activeReport=report.id;

 document.getElementById("newReportName").value="";

 saveData();

 updateReports();

}

function selectReport(){

 activeReport=Number(document.getElementById("reportSelect").value);

 updateReports();

}

function currentReport(){

 return reports.find(r=>r.id===activeReport);

}

function addTransaction(){

 const data=calculate();

 if(data.amount<=0){

  alert("Введите сумму");

  return;

 }

 const report=currentReport();

 if(!report){

  alert("Сначала создайте отчёт");

  return;

 }

 report.transactions.push({

  date:new Date().toLocaleString("ru-RU"),

  amount:data.amount,

  from:data.from,

  result:data.result,

  to:data.to

 });

 saveData();

 updateReports();

 alert("Операция добавлена в отчёт");

}

function renameReport(){

 const report=currentReport();

 if(!report)return;

 const name=prompt("Новое название отчёта:",report.name);

 if(name && name.trim()){

  report.name=name.trim();

  saveData();

  updateReports();

 }

}

function deleteReport(){

 const report=currentReport();

 if(!report)return;

 if(!confirm("Удалить отчёт «"+report.name+"» и все его операции?"))return;

 reports=reports.filter(r=>r.id!==activeReport);

 if(reports.length===0){

  reports.push({

   id:Date.now(),

   name:"Новый отчёт",

   transactions:[]

  });

 }

 activeReport=reports[0].id;

 saveData();

 updateReports();

}

function updateReports(){

 const select=document.getElementById("reportSelect");

 select.innerHTML="";

 reports.forEach(r=>{

  const option=document.createElement("option");

  option.value=r.id;

  option.textContent=r.name;

  if(r.id===activeReport)option.selected=true;

  select.appendChild(option);

 });

 const report=currentReport();

 if(!report)return;

 const transactions=report.transactions;

 const count=transactions.length;

 const turnover=transactions.reduce((sum,t)=>sum+t.kgs,0);

 document.getElementById("reportInfo").innerHTML=

  '<div class="report-title">'+escapeHTML(report.name)+'</div>'+

  '<p>Количество операций: '+count+'</p>'+

  '<p>Оборот в сомах: '+turnover.toLocaleString("ru-RU",{maximumFractionDigits:2})+' KGS</p>';

 const history=document.getElementById("history");

 if(count===0){

  history.textContent="В этом отчёте пока нет операций.";

  return;

 }

 history.innerHTML="";

 [...transactions].reverse().forEach(t=>{

  const item=document.createElement("div");

  item.className="transaction";

  item.innerHTML=

   '<div><b>'+t.amount+' '+t.from+' → '+

   Number(t.result).toLocaleString("ru-RU",{maximumFractionDigits:4})+

   ' '+t.to+'</b></div>'+

   '<div class="small">'+escapeHTML(t.date)+'</div>';

  history.appendChild(item);

 });

}

function escapeHTML(value){

 return String(value).replace(/[&<>"']/g,function(c){

  return {

   "&":"&amp;",

   "<":"&lt;",

   ">":"&gt;",

   '"':"&quot;",

   "'":"&#039;"

  }[c];

 });

}

function exportCSV(){

 const report=currentReport();

 if(!report || report.transactions.length===0){

  alert("В отчёте нет операций");

  return;

 }

 let rows=[

  ["Дата","Сумма от клиента","Валюта","Клиент получает","Валюта получения"]

 ];

 report.transactions.forEach(t=>{

  rows.push([t.date,t.amount,t.from,t.result,t.to]);

 });

 const csv="\uFEFF"+rows.map(row=>

  row.map(value=>'"'+String(value).replace(/"/g,'""')+'"').join(";")

 ).join("\n");

 const blob=new Blob([csv],{type:"text/csv;charset=utf-8;"});

 const url=URL.createObjectURL(blob);

 const a=document.createElement("a");

 a.href=url;

 a.download=report.name.replace(/[\\/:*?"<>|]/g,"_")+".csv";

 a.click();

 URL.revokeObjectURL(url);

}

loadData();

</script>

</body>

</html>
